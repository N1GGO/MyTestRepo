<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hallo Welt PWA</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  h1 {
    font-size: 2rem;
  }
  button {
    margin-top: 1.5rem;
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: white;
    cursor: pointer;
  }
  button:active {
    background: #3730a3;
  }
  #lines {
    margin-top: 1rem;
    font-size: 1.1rem;
    text-align: center;
  }
  #lines p {
    margin: 0.25rem 0;
  }
  button:disabled {
    background: #a5a5a5;
    cursor: default;
  }
</style>
</head>
<body>
  <h1>Hallo Welt</h1>
  <button id="btn">Klick mich</button>
  <div id="lines"></div>

  <script>
    const messages = ['Ich liebe dich, Sandy.', 'Wirklich.', 'Sicher.', 'Absolut.'];
    let clicks = 0;
    const btn = document.getElementById('btn');
    const lines = document.getElementById('lines');
    btn.addEventListener('click', () => {
      const line = document.createElement('p');
      line.textContent = messages[clicks];
      lines.appendChild(line);
      clicks++;
      if (clicks >= messages.length) {
        btn.disabled = true;
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
